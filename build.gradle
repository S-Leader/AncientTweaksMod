plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.107'
}
group = 'com.keletu.calamitycurios'
version = '0.1.0'
base { archivesName = 'calamitycurios-1.21.1' }
java { toolchain.languageVersion = JavaLanguageVersion.of(21) }
neoForge {
    version = '21.1.230'
    //accessTransformers.from file('src/main/resources/META-INF/accesstransformer.cfg')
}
dependencies { compileOnly fileTree('libs') { include '*.jar' } }
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs += ['-Xmaxerrs', '1000', '-proc:none']
}
tasks.named('jar') {
    manifest { attributes 'Implementation-Version': project.version, 'MixinConfigs': 'calamitycurios.mixins.json' }
}

tasks.named('processResources') {
    def metadata = [
            mod_id     : 'calamitycurios', mod_name: 'CalamityCurios', mod_license: 'All Rights Reserved',
            mod_version: project.version.toString(), loader_version_range: '[4,)',
            neo_version: '21.1.230', minecraft_version_range: '[1.21.1,1.21.2)'
    ]
    inputs.properties metadata
    filesMatching('META-INF/neoforge.mods.toml') { expand metadata }
}

sourceSets {
    communityVerification {
        java.srcDir 'src/verification/java'
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
    }
}
